[meta]
name = "resolve_business"
version = "0.2"
description = "Suggest real candidate businesses for a free-text query using Gemini's world knowledge"
tags = ["booking", "lookup"]

[runtime]
model_hint = "small"
tools = []
default_isolation = "process"

[budget]
tokens = 3_500
wall_seconds = 20
joules = 0

[[requires.inputs]]
name = "business_query"
type = "string"
description = "Free-text name or description of the business to find"
example = "pizza places in mumbai"

[output]
schema = "object"
required = ["candidates", "confidence", "needs_disambiguation"]

[output.properties.candidates]
type = "array"
description = "Real plausible matches (0..5 items)"
format = "json"
items = "object"

[output.properties.best_match]
type = "object"
description = "When confidence is high, the single best candidate. Null when user must disambiguate."
format = "json"

[output.properties.confidence]
type = "number"
description = "0..1 — how confident the match is"
format = "text"

[output.properties.needs_disambiguation]
type = "boolean"
description = "True when the orchestrator should ask the user to pick from candidates"
format = "text"

[graph]
can_spawn = []
