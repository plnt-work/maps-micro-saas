[meta]
name = "check_availability"
version = "0.3"
description = "Return realistic open slots, date-anchored on today. Single-shot, structured."
tags = ["booking", "availability"]

[runtime]
model_hint = "small"
tools = []
max_steps = 1
default_isolation = "process"

[budget]
tokens = 3_000
wall_seconds = 20
joules = 0

[[requires.inputs]]
name = "business_name"
type = "string"
description = "Display name of the business"
example = "Joey's Pizza"

[[requires.inputs]]
name = "date_hint"
type = "string"
description = "Natural-language date/time the user asked about"
example = "tomorrow at 7pm"

[[requires.inputs]]
name = "today"
type = "string"
description = "Reference date in ISO format — used to resolve 'tomorrow' etc."
example = "2026-06-21"

[response_schema]
type = "object"
required = ["slots", "note"]
additionalProperties = false

[response_schema.properties.slots]
type = "array"

[response_schema.properties.slots.items]
type = "string"

[response_schema.properties.note]
type = "string"

[graph]
can_spawn = []
