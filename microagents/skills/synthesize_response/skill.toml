[meta]
name = "synthesize_response"
version = "0.1"
description = "Turn the internal micro-agent trace into ONE conversational user-facing reply"
tags = ["orchestrator", "synthesis", "user-facing"]

[runtime]
model_hint = "small"
tools = []
default_isolation = "process"

[budget]
tokens = 2_500
wall_seconds = 12
joules = 0

[[requires.inputs]]
name = "user_message"
type = "string"
description = "The user's most recent message"
example = "find me pizza places in mumbai"

[[requires.inputs]]
name = "trace"
type = "list"
description = "List of {role, output} from the micro-agents that ran this turn"
example = "[{role: classify_intent, output: {...}}, ...]"

[output]
schema = "object"
required = ["say"]

[output.properties.say]
type = "string"
description = "Single conversational reply for the end user — natural language, no JSON"
format = "text"

[output.properties.action]
type = "object"
description = "Optional structured action attached to the reply. Renderable by the client."
format = "json"

[graph]
can_spawn = []
