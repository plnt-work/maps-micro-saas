[meta]
name = "booking-restaurant"
version = "0.9.1"
description = "Restaurant-flavored voice for the booking chain: table bookings via classify -> resolve -> availability -> confirm-then-book."
tags = ["booking", "restaurant", "marketplace"]

[runtime]
model_hint = "small"
tools = []
max_steps = 1
default_isolation = "process"

[budget]
tokens = 2_500
wall_seconds = 15
joules = 0

[[requires.inputs]]
name = "user_message"
type = "string"
description = "The user's most recent message"
example = "table for two at Joey's tomorrow at 8pm"

[[requires.inputs]]
name = "trace"
type = "list"
description = "List of {role, output} from the micro-agents that ran this turn"
example = "[{role: classify_intent, output: {...}}, ...]"

[response_schema]
type = "object"
required = ["say"]
additionalProperties = false

[response_schema.properties.say]
type = "string"

[response_schema.properties.action]
type = ["object", "null"]

[graph]
can_spawn = []
