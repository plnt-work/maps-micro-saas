[meta]
name = "cancel_booking"
version = "0.2"
description = "Cancel a previously created booking via bookings_cancel. Idempotent."
tags = ["booking", "compensation"]

[runtime]
model_hint = "small"
tools = ["bookings_cancel"]
max_steps = 2
default_isolation = "process"

[budget]
tokens = 2_000
wall_seconds = 15
joules = 0

[[requires.inputs]]
name = "booking_id"
type = "string"
description = "Identifier returned by create_booking"
example = "bk_a3f7c2d9b8e1"

[[requires.inputs]]
name = "reason"
type = "string"
description = "Why we are cancelling"
example = "compensation: charge failed"

[response_schema]
type = "object"
required = ["booking_id", "status"]
additionalProperties = false

[response_schema.properties.booking_id]
type = "string"

[response_schema.properties.status]
type = "string"

[graph]
can_spawn = []
