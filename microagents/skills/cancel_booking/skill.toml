[meta]
name = "cancel_booking"
version = "0.1"
description = "Cancel a previously created booking. Idempotent (no-op on already-cancelled)."
tags = ["booking", "compensation"]

[runtime]
model_hint = "small"
tools = []
default_isolation = "process"

[budget]
tokens = 2_000
wall_seconds = 15
joules = 0

[[requires.inputs]]
name = "booking_id"
type = "string"
description = "Identifier returned by create_booking"
example = "bk_a3f7c2d9b8e1"

[[requires.inputs]]
name = "reason"
type = "string"
description = "Why we are cancelling (e.g. 'compensation: charge failed')"
example = "compensation: charge failed"

[output]
schema = "object"
required = ["booking_id", "status"]

[output.properties.booking_id]
type = "string"
description = "Echoed back"
format = "text"

[output.properties.status]
type = "string"
description = "One of: cancelled | already_cancelled | not_found"
format = "text"

[graph]
can_spawn = []
