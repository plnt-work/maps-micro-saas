[project]
name = "plnt-cloud"
version = "0.1.0"
description = "Multi-tenant micro-agent platform built on top of the plnt runtime."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "den-agent" }]

dependencies = [
    "plnt",              # installed via the [tool.uv.sources] / pip editable below
    "temporalio>=1.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
memori = [
    # Memori is optional; the adapter falls back to a SQLite stub when absent
    # so slice-1 e2e runs without it. Install when you want real recall.
    "memorisdk>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tenancy*", "memory*", "workflows*", "channels*", "microagents*", "surface*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
