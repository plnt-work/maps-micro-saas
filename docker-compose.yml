# Temporal + Postgres dev stack for plnt-cloud slice 1.
#
# Brings up:
#   - postgres        (server's persistence store)
#   - temporal        (auto-setup: creates schema + default namespace on first boot)
#   - temporal-ui     (web dashboard at http://localhost:8233)
#
# Run:
#   docker compose up -d
#   docker compose logs -f temporal     # wait for "Temporal server started"
#
# The plnt-cloud worker + surface run on the host (python -m workflows.worker
# and uvicorn surface.app:app) and talk to localhost:7233. They are NOT in
# this compose so editing source doesn't require rebuilding an image.

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.27.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

volumes:
  pg-data:
